<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렐릭 마스터: 사막의 유산</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; transition: background 0.5s; overflow-x: hidden; }
        .bg-jungle { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        .bg-desert { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        .chest-shake { animation: shake 0.5s infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } }
        .screen-shake { animation: screenShake 0.4s; }
        @keyframes screenShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateY(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateY(5px); } }
        .border-normal { border: 2px solid #4ade80; } 
        .border-rare { border: 2px solid #60a5fa; box-shadow: 0 0 10px #60a5fa; }
        .border-epic { border: 3px solid #c084fc; box-shadow: 0 0 15px #c084fc; animation: pulse 2s infinite; }
        .border-legendary { border: 4px solid #facc15; box-shadow: 0 0 25px #facc15; animation: glow 1.5s infinite alternate; }
        .mastery-1 { outline: 2px dashed #ffffff; outline-offset: 2px; }
        .mastery-2 { outline: 3px double #facc15; outline-offset: 4px; }
        .relic-locked { filter: grayscale(1) brightness(0.2); opacity: 0.4; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="game-app" class="max-w-md mx-auto min-h-screen flex flex-col p-4 relative">
        <!-- [1] 항구 -->
        <section id="port-screen" class="flex-1 flex flex-col items-center justify-center space-y-6 text-center">
            <h1 class="text-5xl text-yellow-500 drop-shadow-lg mb-2">⚓ 탐험가의 항구</h1>
            <div class="bg-slate-800/80 p-5 rounded-2xl w-full border border-slate-700 shadow-xl">
                <div id="region-buttons" class="grid grid-cols-1 gap-4">
                    <button id="btn-jungle" onclick="alert('항로 준비중입니다!')" class="bg-emerald-900/40 p-5 rounded-xl text-2xl opacity-50 relative group cursor-not-allowed">
                        🌿 아마존 정글<br><span class="text-xs font-normal">(항로 준비중)</span>
                    </button>
                    <!-- 사막 버튼: 초기엔 보이고, 데이터 로드 후 문제가 없으면 활성화 상태 유지 -->
                    <button id="btn-desert" onclick="handleRegionSelect('desert')" class="bg-orange-600 p-5 rounded-xl text-2xl shadow-lg active:scale-95 transition">🏜️ 이집트 사막</button>
                </div>
            </div>
            <button onclick="showCollection()" class="bg-blue-600/50 hover:bg-blue-600 px-6 py-3 rounded-full border border-blue-400 text-lg transition shadow-lg font-bold">📜 나의 렐릭 도감</button>
            <p id="status-msg" class="text-xs text-yellow-200 opacity-60 italic">데이터 로딩 중...</p>
        </section>

        <!-- [2] 단원 선택 -->
        <section id="unit-screen" class="hidden flex-1 flex flex-col items-center justify-center space-y-6 text-center">
            <button onclick="showPort()" class="absolute top-6 left-6 text-slate-400 font-bold text-lg">◀ 뒤로</button>
            <h2 class="text-3xl text-yellow-400 font-bold">📜 탐험 단원 선택</h2>
            <div class="grid grid-cols-2 gap-4 w-full">
                <button onclick="handleUnitSelect(1)" class="bg-slate-800 p-6 rounded-xl border-2 border-slate-600 hover:border-yellow-500 text-xl shadow-md">1단원<br><span class="text-xs font-normal opacity-60">(동물보호)</span></button>
                <button onclick="handleUnitSelect(2)" class="bg-slate-800 p-6 rounded-xl border-2 border-slate-600 hover:border-yellow-500 text-xl shadow-md">2단원<br><span class="text-xs font-normal opacity-60">(다크패턴)</span></button>
                <button class="bg-slate-900/50 p-6 rounded-xl border-2 border-slate-800 text-slate-600 text-xl cursor-not-allowed">3단원<br>🔒</button>
                <button class="bg-slate-900/50 p-6 rounded-xl border-2 border-slate-800 text-slate-600 text-xl cursor-not-allowed">4단원<br>🔒</button>
            </div>
        </section>

        <!-- [3] 난이도 선택 -->
        <section id="difficulty-screen" class="hidden flex-1 flex flex-col items-center justify-center space-y-6 text-center">
            <button onclick="showUnitSelect()" class="absolute top-6 left-6 text-slate-400 font-bold text-lg">◀ 뒤로</button>
            <h2 class="text-3xl text-orange-400 font-bold">🏜️ 시련의 난이도</h2>
            <div class="grid grid-cols-1 gap-4 w-full">
                <button onclick="startGame('low')" class="bg-slate-700 p-5 rounded-xl text-xl border-b-4 border-green-500">모래언덕 (하)</button>
                <button onclick="startGame('mid')" class="bg-slate-700 p-5 rounded-xl text-xl border-b-4 border-yellow-500">피라미드 (중)</button>
                <button onclick="startGame('high')" class="bg-slate-700 p-5 rounded-xl text-xl border-b-4 border-red-500">스만큼스 사원 (상)</button>
            </div>
        </section>

        <!-- [4] 전투 -->
        <section id="battle-screen" class="hidden flex-1 flex flex-col pt-4">
            <div class="flex justify-between items-center bg-black/40 p-3 rounded-full mb-4">
                <div id="player-hearts" class="text-xl">❤️❤️❤️</div>
                <div class="flex-1 mx-4 bg-gray-700 h-3 rounded-full overflow-hidden">
                    <div id="hp-fill" class="bg-gradient-to-r from-red-500 to-orange-400 h-full transition-all duration-500" style="width: 100%;"></div>
                </div>
            </div>
            <div class="flex-1 flex flex-col items-center">
                <img id="opponent-img" src="https://cdn-icons-png.flaticon.com/512/3141/3141381.png" class="h-36 object-contain mb-4">
                <div id="q-card" class="bg-white text-slate-800 p-5 rounded-2xl shadow-2xl w-full flex-1 mb-4 flex flex-col overflow-y-auto">
                    <div class="flex justify-between items-center mb-1">
                        <span id="q-topic" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded"></span>
                        <span id="q-diff" class="text-[10px] font-bold px-2 border rounded"></span>
                    </div>
                    <h2 id="q-prompt" class="text-base font-bold mb-4 text-slate-900 leading-tight"></h2>
                    <div id="q-options" class="grid grid-cols-1 gap-2 mt-auto"></div>
                </div>
            </div>
        </section>

        <!-- [5] 보상 -->
        <section id="reward-screen" class="hidden flex-1 flex flex-col items-center justify-center text-center">
            <h2 id="reward-title" class="text-3xl font-bold mb-2 text-yellow-400">MISSION CLEAR</h2>
            <div id="chest-container" onclick="handleChestClick()" class="cursor-pointer transition-transform relative">
                <div id="light-aura" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full blur-3xl opacity-0 transition-opacity duration-1000"></div>
                <img id="chest-img" src="https://cdn-icons-png.flaticon.com/512/2855/2855521.png" class="h-52 relative z-10">
            </div>
            <p id="reward-msg" class="mt-6 text-yellow-200 animate-pulse text-lg">상자를 터치하여 렐릭을 발굴하세요!</p>
        </section>

        <!-- [6] 도감 -->
        <section id="collection-screen" class="hidden flex-1 flex flex-col">
            <button onclick="showPort()" class="absolute top-6 left-6 text-slate-400 font-bold">◀ 돌아가기</button>
            <div class="mt-12 mb-4 flex justify-between items-end border-b border-blue-900 pb-2">
                <h2 class="text-2xl text-blue-400 font-bold">📜 렐릭 도감</h2>
                <span id="collection-progress" class="text-xs text-yellow-500 font-bold">진행률: 0%</span>
            </div>
            <div id="relic-list-container" class="flex-1 overflow-y-auto p-1 space-y-8 pb-10"></div>
        </section>
    </div>

                {id:'d1_l2', name:'호루스의 수호안', rarity:'legendary', desc:'모든 생명체를 악으로부터 지켜주는 문양입니다.', img:'https://cdn-icons-png.flaticon.com/512/3141/3141381.png'}
            ],
            2: [
                {id:'d2_n1', name:'구겨진 영수증', rarity:'normal', desc:'충동구매의 흔적이 담긴 종이 조각입니다.', img:'https://cdn-icons-png.flaticon.com/512/1611/1611174.png'},
                {id:'d2_n2', name:'할인 스티커', rarity:'normal', desc:'우리의 눈을 가렸던 유혹적인 스티커입니다.', img:'https://cdn-icons-png.flaticon.com/512/2522/2522204.png'},

                {id:'d2_n4', name:'동전 주머니', rarity:'normal', desc:'다크 패턴으로부터 지켜낸 소중한 가치입니다.', img:'https://cdn-icons-png.flaticon.com/512/218/218353.png'},

                {id:'d2_r2', name:'광고 제거 실드', rarity:'rare', desc:'기만적 마케팅으로부터 당신을 보호합니다.', img:'https://cdn-icons-png.flaticon.com/512/2092/2092215.png'},
                {id:'d2_r3', name:'진실의 돋보기', rarity:'rare', desc:'약관 속의 다크 패턴을 찾아내는 도구입니다.', img:'https://cdn-icons-png.flaticon.com/512/158/158740.png'},
                {id:'d2_r4', name:'디지털 보안 키', rarity:'rare', desc:'개인 정보 보관함을 여는 유일한 열쇠입니다.', img:'https://cdn-icons-png.flaticon.com/512/3064/3064197.png'},

                {id:'d2_e2', name:'나일강의 보석', rarity:'epic', desc:'탐욕을 버리고 지혜를 얻은 자의 보석입니다.', img:'https://cdn-icons-png.flaticon.com/512/1039/1039460.png'},
                {id:'d2_e3', name:'영원한 계약 펜', rarity:'epic', desc:'돌이킬 수 없는 계약의 무서움을 경고합니다.', img:'https://cdn-icons-png.flaticon.com/512/2303/2303914.png'},
                {id:'d2_e4', name:'디지털 스카라베', rarity:'epic', desc:'온라인 세계의 질서를 바로잡는 상징입니다.', img:'https://cdn-icons-png.flaticon.com/512/1039/1039487.png'},
                {id:'d2_l1', name:'라의 진실 구체', rarity:'legendary', desc:'다크 패턴을 꿰뚫어 보는 강렬한 빛입니다.', img:'https://cdn-icons-png.flaticon.com/512/1039/1039471.png'},
                {id:'d2_l2', name:'지혜의 앙크', rarity:'legendary', desc:'영원한 지혜를 주는 고대의 열쇠입니다.', img:'https://cdn-icons-png.flaticon.com/512/1553/1553878.png'}
            ]
        };

        let state = {
            allData: [], sessionQuestions: [], region: '', unit: 1, difficulty: 'low',
            hearts: 3, hp: 100, currentIdx: 0, hintGiven: false, correctCount: 0,
            inventory: JSON.parse(localStorage.getItem('relic_inv_v5')) || {}, isChestOpening: false
        };

        async function smartLoadData() {
            const params = new URLSearchParams(window.location.search);
            const dataUrl = params.get('data');
            const statusMsg = document.getElementById('status-msg');
            if (!dataUrl) { statusMsg.innerHTML = "⚠️ 주소 뒤에 <b>?data=링크</b>를 붙여주세요."; return; }
            try {
                const res = await fetch(dataUrl + '?v=' + Date.now()).then(r => r.json());
                state.allData = res;
                statusMsg.innerText = "✅ 탐험 준비 완료!";
            } catch (e) { statusMsg.innerText = "❌ 데이터 로드 실패 (Gist 확인 요망)"; }
        }

        function showPort() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('port-screen').classList.remove('hidden');
            document.body.className = 'bg-slate-900';
            document.body.classList.remove('screen-shake');
        }

        function handleRegionSelect(region) {
            state.region = region;
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('unit-screen').classList.remove('hidden');
        }

        function handleUnitSelect(u) {
            state.unit = u;
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('difficulty-screen').classList.remove('hidden');
        }

        function showUnitSelect() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('unit-screen').classList.remove('hidden');
        }

        function startGame(diff) {
            state.difficulty = diff;
            let unitQs = state.allData.filter(q => q.unit == state.unit);
            if(unitQs.length === 0) unitQs = state.allData;
            const p = {
                l: unitQs.filter(q => q.difficulty === 'low'),
                m: unitQs.filter(q => q.difficulty === 'mid'),
                h: unitQs.filter(q => q.difficulty === 'high')
            };
            let session = [];
            const pick = (arr, n) => [...arr].sort(()=>0.5-Math.random()).slice(0,n);
            if(diff==='low') { session.push(...pick(p.l, 4), ...pick(p.m, 1)); }
            else if(diff==='mid') { session.push(...pick(p.l, 1), ...pick(p.m, 3), ...pick(p.h, 1)); }
            else { session.push(...pick(p.m, 1), ...pick(p.h, 4)); }
            while(session.length < 5 && unitQs.length > 0) { session.push(unitQs[Math.floor(Math.random()*unitQs.length)]); }
            state.sessionQuestions = session.sort(()=>0.5-Math.random());
            state.hearts = 3; state.currentIdx = 0; state.hp = 100; state.hintGiven = false; state.correctCount = 0;
            document.body.className = 'bg-desert';
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('battle-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.sessionQuestions[state.currentIdx];
            document.getElementById('player-hearts').innerText = "❤️".repeat(state.hearts);
            document.getElementById('hp-fill').style.width = `${state.hp}%`;
            document.getElementById('q-topic').innerText = q.topic || "탐험";
            document.getElementById('q-diff').innerText = q.difficulty.toUpperCase();
            document.getElementById('q-prompt').innerText = q.prompt;
            const opts = document.getElementById('q-options');
            opts.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-3 border-2 border-slate-200 rounded-xl hover:bg-blue-50 text-left font-bold text-slate-700 active:scale-95 transition-all text-sm";
                btn.innerText = opt;
                btn.onclick = () => {
                    if (opt === q.correctAnswer) {
                        if(!state.hintGiven) state.correctCount++;
                        state.hp -= (q.difficulty === 'low' ? 18 : q.difficulty === 'high' ? 24 : 20);
                        state.currentIdx++; state.hintGiven = false;
                        if(state.currentIdx >= 5) { state.hp = 0; document.getElementById('hp-fill').style.width="0%"; setTimeout(showReward, 500); }
                        else renderQuestion();
                    } else {
                        if(!state.hintGiven) { alert(`💡 힌트:\n${q.explanation}`); state.hintGiven = true; }
                        else {
                            state.hearts--;
                            if(state.hearts <= 0) { alert("⚠️ 패배! 항구로 돌아갑니다."); location.reload(); }
                            else { alert("오답입니다. 하트 감소!"); state.hintGiven = false; state.currentIdx++; 
                                   if(state.currentIdx >= 5) showReward(); else renderQuestion(); }
                        }
                    }
                };
                opts.appendChild(btn);
            });
        }

        function showReward() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('reward-screen').classList.remove('hidden');
            document.getElementById('reward-title').innerText = state.correctCount === 5 ? "PERFECT CLEAR!" : "MISSION CLEAR";
            document.getElementById('reward-msg').innerText = "상자를 터치하여 렐릭을 얻으세요!";
            document.getElementById('light-aura').style.opacity = '0';
            state.isChestOpening = false;
        }

        function handleChestClick() {
            if(state.isChestOpening) return;
            state.isChestOpening = true;
            document.getElementById('chest-container').classList.add('chest-shake');
            setTimeout(determineRelic, 1000);
        }

        function determineRelic() {
            document.getElementById('chest-container').classList.remove('chest-shake');
            const table = { low: [88, 10, 1, 1], mid: [59, 30, 10, 1], high: [30, 50, 15, 5] };
            let prob = [...table[state.difficulty]];
            let isPerfect = state.correctCount === 5;
            if(isPerfect) { prob[2]*=2.5; prob[3]*=2; prob[0]=100-(prob[1]+prob[2]+prob[3]); }
            const roll = Math.random() * 100;
            let rarity = 'normal';
            if(roll < prob[3]) rarity = 'legendary';
            else if(roll < prob[3]+prob[2]) rarity = 'epic';
            else if(roll < prob[3]+prob[2]+prob[1]) rarity = 'rare';
            const pool = RELICS_DATA[state.unit].filter(r => r.rarity === rarity);
            const relic = pool[Math.floor(Math.random() * pool.length)];
            state.inventory[relic.id] = (state.inventory[relic.id] || 0) + 1;
            localStorage.setItem('relic_inv_v5', JSON.stringify(state.inventory));
            const colors = { normal:'#4ade80', rare:'#60a5fa', epic:'#c084fc', legendary:'#facc15' };
            document.getElementById('light-aura').style.backgroundColor = colors[rarity];
            document.getElementById('light-aura').style.opacity = '1';
            if(isPerfect) confetti({ particleCount: 100, spread: 50, origin: { y: 0.8 } });
            if(rarity === 'legendary') { document.body.classList.add('screen-shake'); confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 }, colors:['#facc15','#ffffff'] }); }
            document.getElementById('reward-msg').innerHTML = `
                <div class="bg-white/10 p-4 rounded-xl border-2 border-dashed mt-4 animate-bounce">
                    <img src="${relic.img}" class="h-20 mx-auto mb-2">
                    <p class="text-xl font-bold" style="color:${colors[rarity]}">[${rarity.toUpperCase()}]</p>
                    <p class="text-2xl mb-2">${relic.name}</p>
                    <p class="text-sm text-slate-300 italic">"${relic.desc}"</p>
                </div>
                <button onclick="location.reload()" class="mt-8 bg-yellow-500 text-black px-10 py-3 rounded-full font-bold shadow-xl">항구로 복귀</button>
            `;
        }

        function showCollection() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('collection-screen').classList.remove('hidden');
            const container = document.getElementById('relic-list-container');
            container.innerHTML = '';
            let totalOwned = 0;
            [1, 2].forEach(u => {
                const section = document.createElement('div');
                section.innerHTML = `<h3 class="text-orange-300 mb-3 font-bold text-xl px-2">🌵 ${u}단원 사막의 유물</h3>`;
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-4 gap-3 p-2";
                RELICS_DATA[u].forEach(r => {
                    const count = state.inventory[r.id] || 0;
                    if(count > 0) totalOwned++;
                    const mastery = count >= 5 ? 2 : count >= 2 ? 1 : 0;
                    const div = document.createElement('div');
                    div.className = `relative p-2 rounded-lg bg-slate-800 flex flex-col items-center border-${r.rarity} ${count==0?'relic-locked':''} mastery-${mastery}`;
                    div.innerHTML = `<img src="${r.img}" class="h-10 w-10"><span class="text-[9px] mt-1 truncate w-full text-center">${count>0?r.name:'???'}</span>${count>1?`<span class="absolute -top-1 -right-1 bg-red-600 text-[10px] px-1.5 rounded-full font-bold">x${count}</span>`:''}`;
                    grid.appendChild(div);
                });
                section.appendChild(grid);
                container.appendChild(section);
            });
            document.getElementById('collection-progress').innerText = `수집률: ${Math.round(totalOwned/40*100)}%`;
        }
        smartLoadData();
    </script>
</body>
</html>
