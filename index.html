<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아마존 & 이집트 탐험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; transition: background 0.5s; overflow-x: hidden; }
        .bg-jungle { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        .bg-desert { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        #opponent-img { transition: all 0.5s ease-in-out; }
        .btn-bounce:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <div id="game-app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        
        <!-- [1] 항구 / 메인 화면 -->
        <section id="port-screen" class="flex-1 flex flex-col items-center justify-center space-y-8 text-center">
            <h1 class="text-5xl text-yellow-500 drop-shadow-lg">⚓ 탐험가의 항구</h1>
            <div class="bg-slate-800/80 p-6 rounded-2xl w-full border border-slate-700">
                <p class="text-lg mb-4">📅 현재: <span id="week-num" class="text-yellow-400">1</span>주차 탐험 기간</p>
                <div class="grid grid-cols-1 gap-4">
                    <button onclick="handleRegionSelect('jungle')" class="bg-emerald-600 hover:bg-emerald-500 p-5 rounded-xl text-2xl shadow-lg btn-bounce">🌿 아마존 정글</button>
                    <button onclick="handleRegionSelect('desert')" class="bg-orange-600 hover:bg-orange-500 p-5 rounded-xl text-2xl shadow-lg btn-bounce">🏜️ 이집트 사막</button>
                </div>
            </div>
            <p id="status-msg" class="text-sm text-yellow-200 opacity-80 italic">지역을 선택하여 모험을 시작하세요!</p>
        </section>

        <!-- [2] 사막 전용: 난이도 선택 화면 -->
        <section id="difficulty-screen" class="hidden flex-1 flex flex-col items-center justify-center space-y-6">
            <h2 class="text-3xl text-orange-400 font-bold">🏜️ 난이도를 선택하세요</h2>
            <div class="grid grid-cols-1 gap-4 w-full">
                <button onclick="startDesertGame('low')" class="bg-slate-700 p-4 rounded-xl text-xl border-b-4 border-green-500">모래언덕 (Easy)</button>
                <button onclick="startDesertGame('mid')" class="bg-slate-700 p-4 rounded-xl text-xl border-b-4 border-yellow-500">피라미드 (Normal)</button>
                <button onclick="startDesertGame('high')" class="bg-slate-700 p-4 rounded-xl text-xl border-b-4 border-red-500">스핑크스 사원 (Hard)</button>
            </div>
            <button onclick="showPort()" class="text-slate-400 underline">뒤로 가기</button>
        </section>

        <!-- [3] 전투 화면 -->
        <section id="battle-screen" class="hidden flex-1 flex flex-col pt-4">
            <div class="flex justify-between items-center bg-black/40 p-3 rounded-full mb-6">
                <div id="player-hearts" class="text-2xl">❤️❤️❤️</div>
                <div class="flex-1 mx-4 bg-gray-700 h-4 rounded-full overflow-hidden">
                    <div id="hp-fill" class="bg-gradient-to-r from-red-500 to-orange-400 h-full transition-all duration-500" style="width: 100%;"></div>
                </div>
            </div>
            <div class="flex-1 flex flex-col items-center">
                <div id="opponent-container" class="h-44 flex items-center justify-center mb-4">
                    <img id="opponent-img" src="" class="h-40 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                </div>
                <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-2xl w-full flex-1 mb-4 flex flex-col overflow-y-auto">
                    <span id="q-topic" class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full w-fit mb-2"></span>
                    <h2 id="q-prompt" class="text-lg font-bold mb-4 leading-tight text-slate-800"></h2>
                    <div id="q-options" class="grid grid-cols-1 gap-2 mt-auto"></div>
                </div>
            </div>
        </section>

        <!-- [4] 보상 화면 -->
        <section id="reward-screen" class="hidden flex-1 flex flex-col items-center justify-center text-center">
            <h2 class="text-4xl font-bold mb-2 text-yellow-400">MISSION CLEAR!</h2>
            <div id="chest-container" onclick="openChest()" class="cursor-pointer hover:scale-110 transition-transform">
                <img id="chest-img" src="" class="h-56 drop-shadow-2xl">
            </div>
            <p class="mt-8 text-yellow-200 animate-pulse text-lg font-bold">상자를 터치하여 채집하세요!</p>
        </section>
    </div>

    <script>
        /* --- [설정/이미지 데이터 - 여기서 수정 가능] --- */
        const ASSETS = {
            sphinx: "https://cdn-icons-png.flaticon.com/512/3141/3141381.png",
            jaguar: "https://cdn-icons-png.flaticon.com/512/1998/1998713.png",
            jungleChest: "https://cdn-icons-png.flaticon.com/512/2926/2926861.png",
            desertChest: "https://cdn-icons-png.flaticon.com/512/2855/2855521.png",
            jungleOpen: "https://cdn-icons-png.flaticon.com/512/2926/2926852.png",
            desertOpen: "https://cdn-icons-png.flaticon.com/512/2855/2855573.png"
        };

        const REWARDS = {
            jungle: [
                { name: "재규어", text: "아마존의 최상위 포식자!" }, { name: "분홍강돌고래", text: "지혜로운 보토의 신비한 기운!" },
                { name: "금강앵무", text: "화려한 노래로 승리를 알립니다!" }, { name: "카피바라", text: "최고의 친절한 친구!" },
                { name: "자이언트수달", text: "강물의 용사가 당신을 칭찬합니다!" }, { name: "부채머리독수리", text: "날카로운 눈매로 정답을 꿰뚫습니다!" },
                { name: "검정카이만", text: "정글의 고요한 힘이 깃듭니다!" }, { name: "나무늘보", text: "여유로운 복습의 시간을 줍니다." },
                { name: "투칸", text: "밝은 부리만큼 빛나는 미래!" }, { name: "독개구리", text: "작지만 치명적인 지식의 힘!" }
            ],
            desert: [
                { name: "루비", text: "태양의 열정을 품은 보석!" }, { name: "사파이어", text: "지혜로운 자의 푸른 빛!" },
                { name: "에메랄드", text: "생명의 신비가 담긴 보석!" }, { name: "황금 카르투슈", text: "행운을 부르는 고대 이름표!" },
                { name: "사막의 장미", text: "인내로 빚어낸 결정체!" }, { name: "오닉스", text: "흔들리지 않는 단단한 마음!" },
                { name: "터키석", text: "여행자를 지켜주는 수호 보석!" }, { name: "자수정", text: "고귀하고 신비로운 정신력!" },
                { name: "라피스 라줄리", text: "밤하늘의 지혜를 담은 보석!" }, { name: "호박", text: "수천 년을 견딘 지식의 화석!" }
            ]
        };

        // --- [게임 시스템 변수] ---
        let state = {
            region: '', hearts: 3, hp: 100, currentIdx: 0, week: 1,
            sessionQuestions: [], allData: { jungle: [], desert: [] }
        };

        // --- [데이터 로드 로직] ---
        async function fetchInitialData() {
            const params = new URLSearchParams(window.location.search);
            const jungleUrl = params.get('jungle');
            const desertUrl = params.get('desert');

            if (!jungleUrl || !desertUrl) {
                document.getElementById('status-msg').innerText = "⚠️ URL 파라미터(?jungle=...&desert=...)가 필요합니다.";
                return;
            }

            try {
                const [jRes, dRes] = await Promise.all([
                    fetch(jungleUrl + '?v=' + Date.now()).then(r => r.json()),
                    fetch(desertUrl + '?v=' + Date.now()).then(r => r.json())
                ]);
                state.allData.jungle = jRes;
                state.allData.desert = dRes;
                state.week = jRes[0]?.week || 1;
                document.getElementById('week-num').innerText = state.week;
                document.getElementById('status-msg').innerText = "✅ 모든 데이터 로드 완료!";
            } catch (e) {
                document.getElementById('status-msg').innerText = "❌ 로드 실패. 링크를 확인하세요.";
            }
        }

        function showPort() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('port-screen').classList.remove('hidden');
            document.body.className = 'bg-slate-900';
        }

        function handleRegionSelect(region) {
            state.region = region;
            if (region === 'desert') {
                document.getElementById('port-screen').classList.add('hidden');
                document.getElementById('difficulty-screen').classList.remove('hidden');
            } else {
                startJungleGame();
            }
        }

        // [정글] 게임 시작
        function startJungleGame() {
            // 정글은 난이도 선택 없이 전체 중 랜덤 5개 (기존 로직 유지)
            state.sessionQuestions = [...state.allData.jungle].sort(() => 0.5 - Math.random()).slice(0, 5);
            initBattle('bg-jungle');
        }

        // [사막] 난이도별 게임 시작
        function startDesertGame(diff) {
            let filtered = state.allData.desert.filter(q => q.difficulty === diff);
            if (filtered.length < 5) filtered = state.allData.desert; // 부족 시 전체에서 보충
            state.sessionQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, 5);
            initBattle('bg-desert');
        }

        function initBattle(bgClass) {
            state.hearts = 3;
            state.currentIdx = 0;
            state.hp = 100;
            document.body.className = bgClass;
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('battle-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.sessionQuestions[state.currentIdx];
            const img = document.getElementById('opponent-img');
            
            if (state.region === 'jungle') {
                img.src = ASSETS.jaguar;
                img.style.opacity = (state.currentIdx === state.sessionQuestions.length - 1) ? "1" : "0";
            } else {
                img.src = ASSETS.sphinx;
                img.style.opacity = "1";
            }

            document.getElementById('player-hearts').innerText = "❤️".repeat(state.hearts);
            document.getElementById('hp-fill').style.width = `${state.hp}%`;
            document.getElementById('q-topic').innerText = q.topic || "탐험";
            document.getElementById('q-prompt').innerText = q.prompt;

            const opts = document.getElementById('q-options');
            opts.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-3 border-2 border-slate-200 rounded-2xl hover:bg-blue-50 text-left font-bold text-slate-700 active:scale-95 transition-all text-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt === q.correctAnswer, q.explanation);
                opts.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, explanation) {
            if (isCorrect) {
                state.hp -= (100 / state.sessionQuestions.length);
                state.currentIdx++;
                if (state.currentIdx >= state.sessionQuestions.length) {
                    state.hp = 0;
                    document.getElementById('hp-fill').style.width = "0%";
                    setTimeout(showReward, 500);
                } else {
                    renderQuestion();
                }
            } else {
                state.hearts--;
                if (state.hearts <= 0) {
                    alert("⚠️ 패배! 항구로 돌아갑니다.");
                    location.reload();
                } else {
                    alert(`💡 힌트:\n${explanation}`);
                    renderQuestion();
                }
            }
        }

        function showReward() {
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('reward-screen').classList.remove('hidden');
            document.getElementById('chest-img').src = (state.region === 'jungle') ? ASSETS.jungleChest : ASSETS.desertChest;
        }

        function openChest() {
            const pool = REWARDS[state.region];
            const offset = (state.week - 1) * 5;
            const item = pool[offset + Math.floor(Math.random() * 5)];
            document.getElementById('chest-img').src = (state.region === 'jungle') ? ASSETS.jungleOpen : ASSETS.desertOpen;
            setTimeout(() => {
                alert(`✨ [${item.name}] 채집 성공! ✨\n"${item.text}"`);
                location.reload();
            }, 500);
        }

        fetchInitialData();
    </script>
</body>
</html>
