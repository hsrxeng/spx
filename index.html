<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아마존 & 이집트 탐험: 렐릭 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; transition: background 0.5s; overflow-x: hidden; }
        
        .bg-jungle { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        .bg-desert { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        
        #opponent-img { transition: all 0.5s ease-in-out; }
        .card-appear { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .relic-locked { filter: grayscale(1) brightness(0.3); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <div id="game-app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        
        <!-- [1] 항구 / 메인 화면 -->
        <section id="port-screen" class="flex-1 flex flex-col items-center justify-center space-y-6 text-center">
            <h1 class="text-5xl text-yellow-500 drop-shadow-lg mb-2">⚓ 탐험가의 항구</h1>
            <div class="bg-slate-800/80 p-5 rounded-2xl w-full border border-slate-700 shadow-xl">
                <p class="text-sm mb-4 opacity-70">매주 새로운 지혜와 렐릭을 찾아 떠나세요!</p>
                <div id="region-buttons" class="grid grid-cols-1 gap-4">
                    <button id="btn-jungle" onclick="handleRegionSelect('jungle')" class="hidden bg-emerald-600 p-5 rounded-xl text-2xl shadow-lg active:scale-95 transition">🌿 아마존 정글<br><span class="text-sm font-normal opacity-80">(항로탐색중)</span></button>
                    <button id="btn-desert" onclick="handleRegionSelect('desert')" class="hidden bg-orange-600 p-5 rounded-xl text-2xl shadow-lg active:scale-95 transition">🏜️ 이집트 사막</button>
                </div>
            </div>
            <button onclick="showCollection()" class="bg-blue-600/50 hover:bg-blue-600 px-6 py-3 rounded-full border border-blue-400 text-lg transition">📜 나의 렐릭 도감 보기</button>
            <p id="status-msg" class="text-xs text-yellow-200 opacity-60">데이터를 감지하는 중...</p>
        </section>

        <!-- [2] 단원 선택 화면 (사막/정글 공통) -->
        <section id="unit-screen" class="hidden flex-1 flex flex-col items-center justify-center space-y-6 text-center">
            <button onclick="showPort()" class="absolute top-6 left-6 text-slate-400">◀ 뒤로가기</button>
            <h2 id="unit-title" class="text-3xl text-yellow-400 font-bold">📜 탐험할 단원 선택</h2>
            <div class="grid grid-cols-2 gap-4 w-full">
                <button onclick="handleUnitSelect(1)" class="bg-slate-800 p-6 rounded-xl border-2 border-slate-600 hover:border-yellow-500 text-xl">1단원</button>
                <button onclick="handleUnitSelect(2)" class="bg-slate-800 p-6 rounded-xl border-2 border-slate-600 hover:border-yellow-500 text-xl">2단원</button>
                <button onclick="handleUnitSelect(3)" class="bg-slate-800 p-6 rounded-xl border-2 border-slate-600 hover:border-yellow-500 text-xl">3단원</button>
                <button onclick="handleUnitSelect(4)" class="bg-slate-800 p-6 rounded-xl border-2 border-slate-600 hover:border-yellow-500 text-xl">4단원</button>
            </div>
        </section>

        <!-- [3] 사막 전용: 난이도 선택 화면 -->
        <section id="difficulty-screen" class="hidden flex-1 flex flex-col items-center justify-center space-y-6 text-center">
            <button onclick="showUnitSelect()" class="absolute top-6 left-6 text-slate-400">◀ 뒤로가기</button>
            <h2 class="text-3xl text-orange-400 font-bold">🏜️ 도전 수준 결정</h2>
            <div class="grid grid-cols-1 gap-4 w-full">
                <button onclick="startGame('desert', 'low')" class="bg-slate-700 p-5 rounded-xl text-xl border-b-4 border-green-500">모래언덕 (하)</button>
                <button onclick="startGame('desert', 'mid')" class="bg-slate-700 p-5 rounded-xl text-xl border-b-4 border-yellow-500">피라미드 (중)</button>
                <button onclick="startGame('desert', 'high')" class="bg-slate-700 p-5 rounded-xl text-xl border-b-4 border-red-500">스만큼스 사원 (상)</button>
            </div>
        </section>

        <!-- [4] 전투 화면 -->
        <section id="battle-screen" class="hidden flex-1 flex flex-col pt-4">
            <div class="flex justify-between items-center bg-black/40 p-3 rounded-full mb-4">
                <div id="player-hearts" class="text-xl">❤️❤️❤️</div>
                <div class="flex-1 mx-4 bg-gray-700 h-3 rounded-full overflow-hidden">
                    <div id="hp-fill" class="bg-gradient-to-r from-red-500 to-orange-400 h-full transition-all duration-500" style="width: 100%;"></div>
                </div>
            </div>
            <div class="flex-1 flex flex-col items-center">
                <div id="opponent-container" class="h-40 flex items-center justify-center mb-4">
                    <img id="opponent-img" src="" class="h-36 object-contain">
                </div>
                <div id="q-card" class="bg-white text-slate-800 p-5 rounded-2xl shadow-2xl w-full flex-1 mb-4 flex flex-col overflow-y-auto card-appear">
                    <div class="flex justify-between items-center mb-2">
                        <span id="q-topic" class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full"></span>
                        <span id="q-diff-badge" class="text-[10px] font-bold px-2 py-0.5 rounded border"></span>
                    </div>
                    <h2 id="q-prompt" class="text-base font-bold mb-4 leading-tight text-slate-900"></h2>
                    <div id="q-options" class="grid grid-cols-1 gap-2 mt-auto"></div>
                </div>
            </div>
        </section>

        <!-- [5] 도감 화면 -->
        <section id="collection-screen" class="hidden flex-1 flex flex-col">
            <button onclick="showPort()" class="absolute top-6 left-6 text-slate-400 font-bold">◀ 돌아가기</button>
            <h2 class="text-3xl text-blue-400 font-bold text-center mt-12 mb-6 border-b border-blue-900 pb-2">📜 나의 렐릭 도감</h2>
            <div id="relic-grid" class="grid grid-cols-3 gap-3 overflow-y-auto p-2">
                <!-- 렐릭 아이템들이 JS로 생성됩니다 -->
            </div>
        </section>

        <!-- [6] 보상 화면 -->
        <section id="reward-screen" class="hidden flex-1 flex flex-col items-center justify-center text-center">
            <h2 class="text-4xl font-bold mb-2 text-yellow-400">MISSION CLEAR!</h2>
            <div id="chest-container" onclick="openChest()" class="cursor-pointer hover:scale-110 transition-transform">
                <img id="chest-img" src="" class="h-52 drop-shadow-2xl">
            </div>
            <p class="mt-6 text-yellow-200 animate-pulse text-lg">상자를 터치하여 렐릭을 얻으세요!</p>
        </section>
    </div>

    <script>
        const ASSETS = {
            sphinx: "https://cdn-icons-png.flaticon.com/512/3141/3141381.png",
            jaguar: "https://cdn-icons-png.flaticon.com/512/1998/1998713.png",
            jungleChest: "https://cdn-icons-png.flaticon.com/512/2926/2926861.png",
            desertChest: "https://cdn-icons-png.flaticon.com/512/2855/2855521.png",
            jungleOpen: "https://cdn-icons-png.flaticon.com/512/2926/2926852.png",
            desertOpen: "https://cdn-icons-png.flaticon.com/512/2855/2855573.png"
        };

        const REWARDS = {
            jungle: [
                { id: 'j1', name: "재규어", text: "아마존의 수호자!", img: "https://cdn-icons-png.flaticon.com/512/1998/1998713.png" },
                { id: 'j2', name: "분홍돌고래", text: "지혜로운 보토!", img: "https://cdn-icons-png.flaticon.com/512/2628/2628834.png" },
                { id: 'j3', name: "금강앵무", text: "승리의 노래!", img: "https://cdn-icons-png.flaticon.com/512/3062/3062326.png" },
                { id: 'j4', name: "카피바라", text: "친절한 친구!", img: "https://cdn-icons-png.flaticon.com/512/3519/3519302.png" },
                { id: 'j5', name: "수달", text: "강물의 용사!", img: "https://cdn-icons-png.flaticon.com/512/3195/3195593.png" }
            ],
            desert: [
                { id: 'd1', name: "루비", text: "태양의 열정!", img: "https://cdn-icons-png.flaticon.com/512/1039/1039474.png" },
                { id: 'd2', name: "사파이어", text: "지혜의 빛!", img: "https://cdn-icons-png.flaticon.com/512/1039/1039487.png" },
                { id: 'd3', name: "에메랄드", text: "생명의 신비!", img: "https://cdn-icons-png.flaticon.com/512/1039/1039494.png" },
                { id: 'd4', name: "카르투슈", text: "행운의 이름표!", img: "https://cdn-icons-png.flaticon.com/512/4397/4397368.png" },
                { id: 'd5', name: "사막장미", text: "인내의 결정!", img: "https://cdn-icons-png.flaticon.com/512/1553/1553878.png" }
            ]
        };

        let state = {
            allData: [], pools: { low: [], mid: [], high: [] },
            sessionQuestions: [], region: '', unit: 1, hearts: 3, hp: 100, currentIdx: 0,
            hintGiven: false,
            myRelics: JSON.parse(localStorage.getItem('myRelics')) || []
        };

        async function smartLoadData() {
            const params = new URLSearchParams(window.location.search);
            const dataUrl = params.get('data');
            if (!dataUrl) return document.getElementById('status-msg').innerText = "⚠️ ?data=Gist링크 필요";

            try {
                const res = await fetch(dataUrl + '?v=' + Date.now()).then(r => r.json());
                state.allData = res;
                
                const jungleKeywords = ['어휘', '단어', '숙어', '속담', 'voca', 'word'];
                const desertKeywords = ['지문', '문법', '어법', '이해', 'grammar', 'text'];

                const hasJungle = res.some(q => jungleKeywords.some(k => q.topic?.includes(k)));
                const hasDesert = res.some(q => desertKeywords.some(k => q.topic?.includes(k)));

                if (hasJungle) document.getElementById('btn-jungle').classList.remove('hidden');
                if (hasDesert) document.getElementById('btn-desert').classList.remove('hidden');
                document.getElementById('status-msg').innerText = "✅ 탐험 준비 완료!";
            } catch (e) { document.getElementById('status-msg').innerText = "❌ 데이터 로드 실패."; }
        }

        function showPort() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('port-screen').classList.remove('hidden');
            document.body.className = 'bg-slate-900';
        }

        function handleRegionSelect(region) {
            state.region = region;
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('unit-screen').classList.remove('hidden');
            document.getElementById('unit-title').innerText = region === 'jungle' ? "🌿 정글 탐험 구역 선택" : "🏜️ 사막 탐험 단원 선택";
        }

        function handleUnitSelect(unit) {
            state.unit = unit;
            if (state.region === 'desert') {
                document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
                document.getElementById('difficulty-screen').classList.remove('hidden');
            } else {
                startGame('jungle', 'low');
            }
        }

        function showUnitSelect() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('unit-screen').classList.remove('hidden');
        }

        function startGame(region, selectedDiff) {
            // 필터링: 선택한 단원(unit)에 해당하는 문제만 추출
            let unitQuestions = state.allData.filter(q => q.unit == state.unit);
            if (unitQuestions.length === 0) unitQuestions = state.allData; // 데이터 없을 시 전체

            const pools = {
                low: unitQuestions.filter(q => q.difficulty === 'low'),
                mid: unitQuestions.filter(q => q.difficulty === 'mid'),
                high: unitQuestions.filter(q => q.difficulty === 'high')
            };

            let session = [];
            const rnd = (arr, n) => [...arr].sort(() => 0.5 - Math.random()).slice(0, n);

            if (selectedDiff === 'low') {
                session.push(...rnd(pools.low, 4), ...rnd(pools.mid, 1));
            } else if (selectedDiff === 'mid') {
                session.push(...rnd(pools.low, 1), ...rnd(pools.mid, 3), ...rnd(pools.high, 1));
            } else {
                session.push(...rnd(pools.mid, 1), ...rnd(pools.high, 4));
            }

            if (session.length < 5) session = rnd(unitQuestions, 5);

            state.sessionQuestions = session.sort(() => 0.5 - Math.random());
            state.hearts = 3; state.currentIdx = 0; state.hp = 100; state.hintGiven = false;

            document.body.className = (region === 'jungle') ? 'bg-jungle' : 'bg-desert';
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('battle-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.sessionQuestions[state.currentIdx];
            const img = document.getElementById('opponent-img');
            const card = document.getElementById('q-card');
            
            card.classList.remove('card-appear');
            void card.offsetWidth; 
            card.classList.add('card-appear');

            if (state.region === 'jungle') {
                img.src = ASSETS.jaguar;
                img.style.opacity = (state.currentIdx === 4) ? "1" : "0";
            } else {
                img.src = ASSETS.sphinx;
                img.style.opacity = "1";
            }

            document.getElementById('player-hearts').innerText = "❤️".repeat(state.hearts);
            document.getElementById('hp-fill').style.width = `${state.hp}%`;
            document.getElementById('q-topic').innerText = q.topic || "탐험";
            
            const badge = document.getElementById('q-diff-badge');
            badge.innerText = q.difficulty.toUpperCase();
            badge.className = `text-[10px] font-bold px-2 py-0.5 rounded border ${
                q.difficulty === 'low' ? 'text-green-600 border-green-200' : 
                q.difficulty === 'mid' ? 'text-yellow-600 border-yellow-200' : 'text-red-600 border-red-200'
            }`;

            document.getElementById('q-prompt').innerText = q.prompt;
            const opts = document.getElementById('q-options');
            opts.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-3 border-2 border-slate-200 rounded-xl hover:bg-blue-50 text-left font-bold text-slate-700 active:scale-95 transition-all text-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt === q.correctAnswer, q.explanation);
                opts.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, explanation) {
            if (isCorrect) {
                const q = state.sessionQuestions[state.currentIdx];
                state.hp -= (q.difficulty === 'low' ? 18 : q.difficulty === 'high' ? 24 : 20);
                state.currentIdx++;
                state.hintGiven = false;
                if (state.currentIdx >= 5) {
                    state.hp = 0; document.getElementById('hp-fill').style.width = "0%";
                    setTimeout(showReward, 500);
                } else renderQuestion();
            } else {
                if (!state.hintGiven) {
                    alert(`💡 힌트:\n${explanation}`);
                    state.hintGiven = true;
                } else {
                    state.hearts--;
                    if (state.hearts <= 0) {
                        alert("⚠️ 기력을 잃고 항구로 귀환합니다.");
                        location.reload();
                    } else {
                        alert("오답입니다! 하트 1개 감소.");
                        state.hintGiven = false; state.currentIdx++;
                        if (state.currentIdx >= 5) showReward(); else renderQuestion();
                    }
                }
            }
        }

        function showReward() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('reward-screen').classList.remove('hidden');
            document.getElementById('chest-img').src = (state.region === 'jungle') ? ASSETS.jungleChest : ASSETS.desertChest;
        }

        function openChest() {
            const pool = REWARDS[state.region];
            const item = pool[Math.floor(Math.random() * pool.length)];
            
            // 렐릭 저장
            if (!state.myRelics.includes(item.id)) {
                state.myRelics.push(item.id);
                localStorage.setItem('myRelics', JSON.stringify(state.myRelics));
            }

            document.getElementById('chest-img').src = (state.region === 'jungle') ? ASSETS.jungleOpen : ASSETS.desertOpen;
            setTimeout(() => {
                alert(`✨ [${item.name}] 획득! ✨\n\n"${item.text}"\n도감에 기록되었습니다.`);
                location.reload();
            }, 500);
        }

        function showCollection() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            const screen = document.getElementById('collection-screen');
            screen.classList.remove('hidden');
            
            const grid = document.getElementById('relic-grid');
            grid.innerHTML = '';
            
            [...REWARDS.jungle, ...REWARDS.desert].forEach(item => {
                const isOwned = state.myRelics.includes(item.id);
                const div = document.createElement('div');
                div.className = "flex flex-col items-center bg-slate-800 p-3 rounded-xl border border-slate-700";
                div.innerHTML = `
                    <img src="${item.img}" class="h-12 w-12 mb-2 ${isOwned ? '' : 'relic-locked'}">
                    <p class="text-[10px] ${isOwned ? 'text-yellow-400' : 'text-slate-600'}">${isOwned ? item.name : '???'}</p>
                `;
                grid.appendChild(div);
            });
        }

        smartLoadData();
    </script>
</body>
</html>
