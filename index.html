<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아마존 & 이집트 탐험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; transition: background 0.5s; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        #opponent-img { transition: all 0.5s ease-in-out; }
        .bg-jungle { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
        .bg-desert { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=800&q=80'); background-size: cover; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <div id="game-app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <!-- [1] 항구 / 메인 화면 -->
        <section id="port-screen" class="flex-1 flex flex-col items-center justify-center space-y-8 text-center">
            <div class="space-y-2">
                <h1 class="text-5xl text-yellow-500 drop-shadow-lg">⚓ 탐험가의 항구</h1>
                <p class="text-xl text-slate-300">매주 새로운 보물을 찾아 떠나세요!</p>
            </div>
            
            <div class="bg-slate-800/80 p-4 rounded-2xl w-full border border-slate-700">
                <p id="current-week-display" class="text-lg mb-4">📅 현재: <span id="week-num" class="text-yellow-400">1</span>주차 탐험 기간</p>
                <div class="grid grid-cols-1 gap-4">
                    <button onclick="prepareGame('jungle')" class="bg-emerald-600 hover:bg-emerald-500 p-5 rounded-xl text-2xl shadow-lg transform active:scale-95 transition">🌿 아마존 정글</button>
                    <button onclick="prepareGame('desert')" class="bg-orange-600 hover:bg-orange-500 p-5 rounded-xl text-2xl shadow-lg transform active:scale-95 transition">🏜️ 이집트 사막</button>
                </div>
            </div>
            <p id="status-msg" class="text-sm text-yellow-200 opacity-80 italic">데이터 로딩 중...</p>
        </section>

        <!-- [2] 전투 화면 -->
        <section id="battle-screen" class="hidden flex-1 flex flex-col pt-4">
            <div class="flex justify-between items-center bg-black/40 p-3 rounded-full mb-6">
                <div id="player-hearts" class="text-2xl drop-shadow">❤️❤️❤️</div>
                <div class="flex-1 mx-4 bg-gray-700 h-4 rounded-full overflow-hidden">
                    <div id="hp-fill" class="bg-gradient-to-r from-red-500 to-orange-400 h-full transition-all duration-500" style="width: 100%;"></div>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center">
                <div id="opponent-container" class="h-48 flex items-center justify-center mb-4">
                    <img id="opponent-img" src="" alt="Guardian" class="h-44 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">
                </div>
                
                <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-2xl w-full flex-1 mb-4 flex flex-col">
                    <span id="q-topic" class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full w-fit mb-2">지문 분석</span>
                    <h2 id="q-prompt" class="text-xl font-bold mb-6 leading-tight text-slate-800"></h2>
                    <div id="q-options" class="grid grid-cols-1 gap-3 mt-auto"></div>
                </div>
            </div>
        </section>

        <!-- [3] 보상 화면 -->
        <section id="reward-screen" class="hidden flex-1 flex flex-col items-center justify-center text-center">
            <h2 class="text-4xl font-bold mb-2 text-yellow-400">MISSION CLEAR!</h2>
            <p class="mb-8 text-xl">가디언이 보물을 남기고 떠났습니다.</p>
            <div id="chest-container" onclick="openChest()" class="cursor-pointer hover:scale-110 transition-transform active:rotate-3">
                <img id="chest-img" src="" alt="Chest" class="h-56 drop-shadow-2xl">
            </div>
            <p class="mt-8 text-yellow-200 animate-pulse text-lg">상자를 터치하여 채집하세요!</p>
        </section>
    </div>

    <script>
        // --- [이미지 자산 설정] ---
        const ASSETS = {
            sphinx: "https://cdn-icons-png.flaticon.com/512/3141/3141381.png",
            jaguar: "https://cdn-icons-png.flaticon.com/512/1998/1998713.png",
            jungleChest: "https://cdn-icons-png.flaticon.com/512/2926/2926861.png",
            desertChest: "https://cdn-icons-png.flaticon.com/512/2855/2855521.png",
            jungleOpen: "https://cdn-icons-png.flaticon.com/512/2926/2926852.png",
            desertOpen: "https://cdn-icons-png.flaticon.com/512/2855/2855573.png"
        };

        // --- [수집품 플레이버 텍스트] ---
        const REWARDS = {
            jungle: [
                { name: "재규어", text: "아마존의 최상위 포식자가 당신을 수호합니다!" },
                { name: "분홍강돌고래", text: "지혜로운 보토가 신비한 기운을 나눠줍니다." },
                { name: "금강앵무", text: "화려한 노래로 당신의 승리를 알립니다." },
                { name: "카피바라", text: "세상에서 가장 친절한 친구가 생겼습니다." },
                { name: "자이언트수달", text: "강물의 용사가 당신의 끈기를 칭찬합니다." },
                { name: "부채머리독수리", text: "날카로운 눈매로 다음 탐험을 돕습니다." },
                { name: "검정카이만", text: "정글의 고요한 힘이 당신에게 깃듭니다." },
                { name: "나무늘보", text: "가끔은 느긋하게 복습하는 여유를 줍니다." },
                { name: "투칸", text: "화려한 부리만큼 밝은 미래가 열립니다." },
                { name: "독개구리", text: "작지만 치명적인 지식의 힘을 얻었습니다." }
            ],
            desert: [
                { name: "루비", text: "태양의 뜨거운 열정을 품은 보석입니다." },
                { name: "사파이어", text: "지혜로운 자만이 가질 수 있는 푸른 보석입니다." },
                { name: "에메랄드", text: "생명의 신비가 담긴 영롱한 보석입니다." },
                { name: "황금 카르투슈", text: "고대 왕의 이름이 새겨진 행운의 상징입니다." },
                { name: "사막의 장미", text: "모래바람을 이겨낸 인내의 결정체입니다." },
                { name: "블랙 오닉스", text: "어떤 유혹에도 흔들리지 않는 마음을 줍니다." },
                { name: "터키석", text: "여행자의 앞길을 밝혀주는 수호 보석입니다." },
                { name: "자수정", text: "고귀하고 신비로운 정신력을 상징합니다." },
                { name: "라피스 라줄리", text: "밤하늘의 별을 담은 고대의 보석입니다." },
                { name: "호박", text: "수천 년의 시간을 견뎌낸 지식의 화석입니다." }
            ]
        };

        let state = {
            allQuestions: [],
            sessionQuestions: [],
            region: '', hearts: 3, hp: 100, currentIdx: 0, week: 1
        };

        // [데이터 로드]
        async function loadData() {
            const params = new URLSearchParams(window.location.search);
            const dataUrl = params.get('data');
            const msg = document.getElementById('status-msg');
            if (!dataUrl) { msg.innerText = "⚠️ URL에 ?data=Gist링크를 넣어주세요."; return; }

            try {
                const response = await fetch(dataUrl + '?v=' + Date.now());
                state.allQuestions = await response.json();
                state.week = state.allQuestions[0]?.week || 1;
                document.getElementById('week-num').innerText = state.week;
                msg.innerText = "✅ 탐험 준비 완료!";
            } catch (e) { msg.innerText = "❌ 데이터 로드 실패."; }
        }

        // [세션 준비] 전체 풀에서 5문제만 무작위 추출
        function prepareGame(region) {
            if (state.allQuestions.length === 0) return alert("데이터가 없습니다.");
            
            state.region = region;
            state.hearts = 3;
            state.currentIdx = 0;
            state.hp = 100;

            // 5문제만 랜덤 추출 (중복 제거)
            let shuffled = [...state.allQuestions].sort(() => 0.5 - Math.random());
            state.sessionQuestions = shuffled.slice(0, 5); 

            document.body.className = (region === 'jungle') ? 'bg-jungle' : 'bg-desert';
            document.getElementById('port-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = state.sessionQuestions[state.currentIdx];
            const img = document.getElementById('opponent-img');
            
            // 이미지 연출: 정글은 마지막 문제에서만 재규어 등장
            if (state.region === 'jungle') {
                img.src = ASSETS.jaguar;
                img.style.opacity = (state.currentIdx === state.sessionQuestions.length - 1) ? "1" : "0";
            } else {
                img.src = ASSETS.sphinx;
                img.style.opacity = "1";
            }

            document.getElementById('player-hearts').innerText = "❤️".repeat(state.hearts);
            document.getElementById('hp-fill').style.width = `${state.hp}%`;
            document.getElementById('q-topic').innerText = q.topic || "심화 학습";
            document.getElementById('q-prompt').innerText = q.prompt;

            const opts = document.getElementById('q-options');
            opts.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-4 border-2 border-slate-200 rounded-2xl hover:bg-blue-50 hover:border-blue-300 text-left transition-all active:scale-95 font-bold text-slate-700";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt === q.correctAnswer, q.explanation);
                opts.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, explanation) {
            if (isCorrect) {
                // 한 세션이 끝나면 딱 0이 되도록 차감
                state.hp -= (100 / state.sessionQuestions.length);
                state.currentIdx++;
                if (state.currentIdx >= state.sessionQuestions.length) {
                    state.hp = 0;
                    document.getElementById('hp-fill').style.width = `0%`;
                    setTimeout(showReward, 500);
                } else {
                    renderQuestion();
                }
            } else {
                state.hearts--;
                document.getElementById('battle-screen').classList.add('shake');
                setTimeout(() => document.getElementById('battle-screen').classList.remove('shake'), 500);
                
                if (state.hearts <= 0) {
                    alert("⚠️ 모든 하트를 잃었습니다! 항구로 긴급 후퇴합니다.");
                    location.reload();
                } else {
                    alert(`💡 힌트:\n${explanation}`);
                    renderQuestion();
                }
            }
        }

        function showReward() {
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('reward-screen').classList.remove('hidden');
            document.getElementById('chest-img').src = (state.region === 'jungle') ? ASSETS.jungleChest : ASSETS.desertChest;
        }

        function openChest() {
            const pool = REWARDS[state.region];
            const offset = (state.week - 1) * 5;
            const item = pool[offset + Math.floor(Math.random() * 5)];
            
            // 상자 열기 이미지
            document.getElementById('chest-img').src = (state.region === 'jungle') ? ASSETS.jungleOpen : ASSETS.desertOpen;
            
            setTimeout(() => {
                alert(`✨ [${item.name}] 채집 성공! ✨\n\n"${item.text}"`);
                location.reload();
            }, 500);
        }

        loadData();
    </script>
</body>
</html>
